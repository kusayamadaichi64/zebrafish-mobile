name: EAS Update (preview)

  on:
    push:
      branches: [main]
    workflow_dispatch: {}

  jobs:
    update:
      name: Publish preview update
      runs-on: ubuntu-latest
      steps:
        - name: Checkout
          uses: actions/checkout@v4

        - name: Setup Node
          uses: actions/setup-node@v4
          with:
            node-version: 24
            cache: npm

        - name: Install dependencies
          run: npm ci

        - name: Setup EAS
          uses: expo/expo-github-action@v8
          with:
            eas-version: latest
            token: ${{ secrets.EXPO_TOKEN }}

        - name: Publish update to preview
          env:
            SHEET_URL: ${{ secrets.GOOGLESPREADSHEETSURL }}
            SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
          run: eas update --branch preview --message "GitHub Actions run ${{ github.run_number
  }}"
